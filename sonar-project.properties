# ==========================================
# SonarQube Configuration - BibleVerse
# ==========================================

# Project identification
sonar.projectKey=APorkolab_BibleVerse
sonar.organization=aporkolab
sonar.projectName=BibleVerse - Bible Verse Lookup Application
sonar.projectVersion=1.0.0
sonar.projectDescription=Angular application for Bible verse lookup using Szentiras.hu API

# Source code configuration
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.min.js,**/*.min.css
sonar.test.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Language configuration
sonar.typescript.lcov.reportPaths=coverage/bibleverse/lcov.info
sonar.javascript.lcov.reportPaths=coverage/bibleverse/lcov.info
sonar.typescript.exclusions=**/node_modules/**,**/dist/**
sonar.javascript.exclusions=**/node_modules/**,**/dist/**

# Code coverage
sonar.coverage.exclusions=**/node_modules/**,**/dist/**,**/*.spec.ts,**/*.test.ts,**/environments/**

# Quality gate
sonar.qualitygate.wait=true

# Analysis parameters
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Angular specific
sonar.typescript.node.maxspace=4096
sonar.javascript.node.maxspace=4096

# Security hotspots
sonar.security.hotspots.inheritFromParent=true

# Issue exclusions
sonar.issue.ignore.multicriteria=e1,e2,e3
# Ignore console.log in development environments
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S2228
sonar.issue.ignore.multicriteria.e1.resourceKey=**/environment.development.ts
# Ignore TODO comments
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1135
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*
# Ignore cognitive complexity in test files
sonar.issue.ignore.multicriteria.e3.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*.spec.ts
