name: 🚀 CI/CD Pipeline - BibleVerse

on:
  push:
    branches: [ main, develop, release/* ]
  pull_request:
    branches: [ main, develop ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip_tests:
        description: 'Skip tests (emergency deployment only)'
        required: false
        default: false
        type: boolean

# Global environment variables
env:
  NODE_VERSION: '24'
  REGISTRY_URL: 'ghcr.io'
  IMAGE_NAME: ${{ github.repository }}/bibleverse

# Cancel previous runs on the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # SETUP & PREPARATION
  # ==========================================
  setup:
    name: 📋 Setup & Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      should-deploy: ${{ steps.deploy-check.outputs.should-deploy }}
      environment: ${{ steps.deploy-check.outputs.environment }}
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🏷️ Generate version
        id: version
        run: |
          if [[ ${{ github.event_name }} == 'release' ]]; then
            VERSION=${{ github.event.release.tag_name }}
          else
            VERSION=$(date +%Y.%m.%d)-${GITHUB_SHA:0:8}
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Version: ${VERSION}"

      - name: 🎯 Determine deployment strategy
        id: deploy-check
        run: |
          SHOULD_DEPLOY=false
          ENVIRONMENT=""

          if [[ ${{ github.event_name }} == 'workflow_dispatch' ]]; then
            SHOULD_DEPLOY=true
            ENVIRONMENT=${{ github.event.inputs.environment }}
          elif [[ ${{ github.event_name }} == 'push' && ${{ github.ref }} == 'refs/heads/main' ]]; then
            SHOULD_DEPLOY=true
            ENVIRONMENT="production"
          elif [[ ${{ github.event_name }} == 'push' && ${{ github.ref }} == 'refs/heads/develop' ]]; then
            SHOULD_DEPLOY=true
            ENVIRONMENT="staging"
          elif [[ ${{ github.event_name }} == 'release' ]]; then
            SHOULD_DEPLOY=true
            ENVIRONMENT="production"
          fi

          echo "should-deploy=${SHOULD_DEPLOY}" >> $GITHUB_OUTPUT
          echo "environment=${ENVIRONMENT}" >> $GITHUB_OUTPUT
          echo "🎯 Should deploy: ${SHOULD_DEPLOY} to ${ENVIRONMENT}"


  # ==========================================
  # CODE QUALITY & SECURITY
  # ==========================================
  code-quality:
    name: 🔍 Code Quality Analysis
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 15

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🎨 Run Prettier check
        run: npm run format:check

      - name: 🧹 Run ESLint
        run: npm run lint:check

      - name: 📊 Run SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@v8
        timeout-minutes: 5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        continue-on-error: true

      - name: 🔒 Run security audit (runtime dependencies)
        run: npm audit --omit=dev --audit-level=moderate

      - name: 🔒 Run security audit (all dependencies, informational)
        run: npm audit --audit-level=moderate
        continue-on-error: true

  # ==========================================
  # TESTING SUITE
  # ==========================================
  test:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    needs: setup
    timeout-minutes: 20
    if: ${{ inputs.skip_tests != true }}

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🧱 Run unit tests
        run: npm run test:ci

      - name: 📊 Upload coverage reports
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/bibleverse/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ==========================================
  # BUILD & PACKAGE
  # ==========================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [setup, code-quality, test]
    timeout-minutes: 15

    strategy:
      matrix:
        environment: [development, staging, production]

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci --no-audit --no-fund

      - name: 🏗️ Build application
        run: npm run build:${{ matrix.environment }}
        env:
          VERSION: ${{ needs.setup.outputs.version }}

      - name: 📦 Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.environment }}
          path: dist/
          retention-days: 30

      - name: 📋 Generate build report
        run: |
          echo "## 🏗️ Build Report - ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ matrix.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Node Version:** ${{ env.NODE_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Time:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "- **Bundle Size:** $(du -sh dist/ | cut -f1)" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # DOCKER BUILD & PUSH
  # ==========================================
  docker:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [setup, build]
    if: needs.setup.outputs.should-deploy == 'true'
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 📦 Download build artifact
        uses: actions/download-artifact@v8
        with:
          name: build-${{ needs.setup.outputs.environment }}
          path: dist/

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/aporkolab/bibleverse/bibleverse
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.setup.outputs.version }}

      - name: 🐳 Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          build-args: |
            VERSION=${{ needs.setup.outputs.version }}
            ENVIRONMENT=${{ needs.setup.outputs.environment }}

  # ==========================================
  # SECURITY SCANNING
  # ==========================================
  security:
    name: 🛡️ Security Scanning
    runs-on: ubuntu-latest
    needs: [setup, docker]
    if: needs.setup.outputs.should-deploy == 'true' && needs.docker.result == 'success'
    timeout-minutes: 15

    permissions:
      security-events: write

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🔐 Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY_URL }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🔍 Prepare image reference
        run: |
          # Use consistent lowercase image name
          IMAGE_REF="ghcr.io/aporkolab/bibleverse/bibleverse:${{ needs.setup.outputs.version }}"
          echo "📦 Image reference: ${IMAGE_REF}"
          echo "IMAGE_REF=${IMAGE_REF}" >> $GITHUB_ENV

          # Debug: Check what images are available
          echo "🔍 Available images with this version:"
          docker manifest inspect "${IMAGE_REF}" && echo "✅ Image exists" || echo "❌ Image not found"

          # Try to list packages to see what's actually available
          echo "📦 Checking package availability..."
          curl -sH "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/user/packages/container/bibleverse%2Fbibleverse/versions" \
            | jq -r '.[].metadata.container.tags[]' | head -5 || echo "Could not fetch package info"

      - name: 🛡️ Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH,MEDIUM'
        continue-on-error: true

      - name: 📊 Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
        continue-on-error: true

  # ==========================================
  # DEPLOYMENT
  # ==========================================
  deploy-staging:
    name: 🚀 Deploy to Staging
    runs-on: ubuntu-latest
    needs: [setup, test, build, docker, security]
    if: needs.setup.outputs.should-deploy == 'true' && needs.setup.outputs.environment == 'staging'
    timeout-minutes: 10
    environment:
      name: staging
      url: https://staging-bibleverse.porkolab.hu

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🚀 Deploy to staging
        run: |
          echo "🚀 Deploying to staging environment..."
          echo "📦 Image: ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }}"
          # Add your staging deployment commands here

      - name: 🧪 Run smoke tests
        run: |
          echo "🧪 Running smoke tests against staging..."
          # Add smoke tests here

      - name: 📢 Notify deployment
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          text: |
            🚀 BibleVerse deployed to staging
            Version: ${{ needs.setup.outputs.version }}
            Environment: staging
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📝 Log deployment status (Slack disabled)
        if: always() && env.SLACK_WEBHOOK_URL == ''
        run: |
          echo "📢 Slack notifications disabled (no webhook URL configured)"
          echo "🚀 BibleVerse deployment completed"
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ needs.setup.outputs.version }}"
          echo "Environment: staging"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [setup, test, build, docker, security]
    if: needs.setup.outputs.should-deploy == 'true' && needs.setup.outputs.environment == 'production'
    timeout-minutes: 15
    environment:
      name: production
      url: https://bibleverse.porkolab.hu

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v7

      - name: 🚀 Deploy to production
        run: |
          echo "🚀 Deploying to production environment..."
          echo "📦 Image: ${{ env.REGISTRY_URL }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.version }}"
          # Add your production deployment commands here

      - name: 🧪 Run smoke tests
        run: |
          echo "🧪 Running smoke tests against production..."
          # Add smoke tests here

      - name: 📢 Notify deployment
        uses: 8398a7/action-slack@v3
        if: always() && env.SLACK_WEBHOOK_URL != ''
        with:
          status: ${{ job.status }}
          text: |
            🎉 BibleVerse deployed to production!
            Version: ${{ needs.setup.outputs.version }}
            Environment: production
            URL: https://bibleverse.porkolab.hu
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

      - name: 📝 Log deployment status (Slack disabled)
        if: always() && env.SLACK_WEBHOOK_URL == ''
        run: |
          echo "📢 Slack notifications disabled (no webhook URL configured)"
          echo "🎉 BibleVerse deployment completed!"
          echo "Status: ${{ job.status }}"
          echo "Version: ${{ needs.setup.outputs.version }}"
          echo "Environment: production"
          echo "URL: https://bibleverse.porkolab.hu"
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ==========================================
  # POST-DEPLOYMENT
  # ==========================================
  post-deployment:
    name: 📊 Post-Deployment
    runs-on: ubuntu-latest
    needs: [setup, deploy-staging, deploy-production]
    if: always() && needs.setup.outputs.should-deploy == 'true'
    timeout-minutes: 10

    steps:
      - name: 📊 Generate deployment summary
        run: |
          echo "## 🎉 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Version:** ${{ needs.setup.outputs.version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ needs.setup.outputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed at:** $(date)" >> $GITHUB_STEP_SUMMARY

      - name: 🔄 Deployment completed
        run: |
          echo "✅ Deployment workflow completed successfully!"
          echo "Environment: ${{ needs.setup.outputs.environment }}"
          echo "Version: ${{ needs.setup.outputs.version }}"
